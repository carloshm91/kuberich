[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "kubetrol"
version = "0.0.1.dev0"
description = "A Kubernetes terminal UI built with Python and Textual"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Herrera", email = "carloshm91@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "kubernetes-asyncio>=36.1.0,<37",
    "platformdirs>=4.12.3,<5",
    "pyyaml>=6.0.3,<7",
    "textual>=8.2.8,<9",
]

[project.scripts]
kubetrol = "kubetrol.cli:main"

[project.urls]
Homepage = "https://github.com/carloshm91/kubetrol"
Repository = "https://github.com/carloshm91/kubetrol"
Issues = "https://github.com/carloshm91/kubetrol/issues"
Changelog = "https://github.com/carloshm91/kubetrol/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "build>=1.6.1,<2",
    "diff-cover>=10.6.0,<11",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.16.10,<0.17",
    "twine>=7.0.0,<8",
    "types-pyyaml>=6.0.12,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kubetrol"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/kubetrol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["kubetrol"]
relative_files = true

[tool.coverage.report]
show_missing = true
precision = 2
include_namespace_packages = true
# Every production decision stays in the denominator, including no-cover pragmas.
exclude_lines = []
partial_branches = []

[tool.coverage.json]
show_contexts = true

[tool.kubetrol.coverage]
# Extend this reviewed list when deterministic security/state decisions are added.
critical_modules = [
    "src/kubetrol/cli.py",
    "src/kubetrol/__main__.py",
    "src/kubetrol/config/schema.py",
    "src/kubetrol/diagnostics/redaction.py",
    "src/kubetrol/security/controls.py",
    "src/kubetrol/security/presentation.py",
    "src/kubetrol/security/arguments.py",
    "src/kubetrol/domain/targets.py",
]
