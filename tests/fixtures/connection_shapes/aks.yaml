apiVersion: v1
kind: Config
current-context: demo-aks
clusters:
- name: demo-aks
  cluster:
    server: https://api.example.invalid
    certificate-authority-data: <owned-certificate-authority-data>
users:
- name: demo-aks
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1
      command: kubelogin
      args:
      - get-token
      - --environment
      - AzurePublicCloud
      - --server-id
      - 00000000-0000-0000-0000-000000000001
      - --client-id
      - 00000000-0000-0000-0000-000000000002
      - --tenant-id
      - 00000000-0000-0000-0000-000000000003
      - --login
      - azurecli
      interactiveMode: Never
contexts:
- name: demo-aks
  context:
    cluster: demo-aks
    user: demo-aks
    namespace: ''
