apiVersion: v1
kind: Config
current-context: demo-gke
clusters:
- name: demo-gke
  cluster:
    server: https://api.example.invalid
    certificate-authority-data: <owned-certificate-authority-data>
users:
- name: demo-gke
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: gke-gcloud-auth-plugin
      interactiveMode: IfAvailable
      provideClusterInfo: true
contexts:
- name: demo-gke
  context:
    cluster: demo-gke
    user: demo-gke
    namespace: ''
