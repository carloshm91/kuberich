apiVersion: v1
kind: Config
current-context: demo-teleport
clusters:
- name: demo-teleport
  cluster:
    server: https://api.example.invalid
    certificate-authority-data: <owned-certificate-authority-data>
    tls-server-name: demo.teleport.example.invalid
    extensions:
    - name: teleport.kube.name
      extension: demo
users:
- name: demo-teleport
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: tsh
      args:
      - kube
      - credentials
      - --kube-cluster=demo
      - --teleport-cluster=demo.example.invalid
      - --proxy=teleport.example.invalid:443
      interactiveMode: IfAvailable
contexts:
- name: demo-teleport
  context:
    cluster: demo-teleport
    user: demo-teleport
    namespace: ''
