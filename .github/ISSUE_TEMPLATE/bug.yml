name: Bug report
description: Report a reproducible problem in a released or development version.
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Kubetrol version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, terminal, installation channel, Python version if applicable, and Kubernetes version. Do not include credentials or kubeconfig contents.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal sanitized steps, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs or terminal recordings with private data removed. Report vulnerabilities privately using SECURITY.md.
