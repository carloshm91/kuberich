name: Feature proposal
description: Propose a concrete terminal or Kubernetes workflow improvement.
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Follow the [delivery contract](https://github.com/carloshm91/kuberich/blob/main/CONTRIBUTING.md#delivery-contract)
        and [quality policy](https://github.com/carloshm91/kuberich/blob/main/docs/quality.md).
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the workflow and the limitation you encounter.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed behavior
      description: Include keyboard interaction and observable acceptance criteria where relevant.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Related issues and alternatives
      description: Link existing roadmap work and explain any different scope.
