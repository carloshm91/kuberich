name: Application quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: Application (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.4'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --locked --group dev
      - name: Check lint, formatting and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy --strict src/kubetrol scripts/check_coverage.py scripts/check_quality_gate.py
      - name: Run behavioral, gate-regression and clean-distribution checks
        run: uv run pytest --cov=kubetrol --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Verify context sessions, snapshots and watches on an owned disposable cluster
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: |
          curl --fail --location --retry 3 --max-time 60 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 --output "$RUNNER_TEMP/kubetrol-kind"
          printf '%s  %s\n' 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d' "$RUNNER_TEMP/kubetrol-kind" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/kubetrol-kind"
          uv run python scripts/verify_contexts_kind.py --kind "$RUNNER_TEMP/kubetrol-kind"
      - name: Enforce independent production and critical-module coverage
        run: uv run python scripts/check_coverage.py coverage.json
      - name: Enforce changed executable-line coverage against the merge base
        env:
          KUBETROL_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git rev-parse --verify "$KUBETROL_COVERAGE_BASE^{commit}"
          uv run diff-cover coverage.xml --compare-branch "$KUBETROL_COVERAGE_BASE" --fail-under 90 --ignore-staged --ignore-unstaged --total-percent-float --format json:diff-coverage.json
      - name: Build and validate artifact metadata
        run: |
          uv build
          uv run twine check dist/*
      - name: Retain coverage evidence and candidate artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            coverage.json
            coverage.xml
            diff-coverage.json
            dist/*
            artifacts/ui/*
            artifacts/terminal/*
            artifacts/cluster/*
          if-no-files-found: error
          retention-days: 7
  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every application matrix job to succeed
        env:
          KUBETROL_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check_quality_gate.py
