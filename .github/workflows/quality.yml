name: Application quality
'on':
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Verification plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select the complete matrix for this event
        id: plan
        run: python3 -m scripts.ci_policy
  application:
    needs: plan
    name: Application (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.4'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --locked --group dev
      - name: Install real terminal transport test tools on Linux
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes openssh-server tmux
          sudo install -d -m 0755 /run/sshd
      - name: Install real terminal transport test tools on macOS
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          brew install tmux
          test -x /usr/sbin/sshd
      - name: Check lint, formatting and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy --strict src/kuberich scripts/check_coverage.py scripts/check_quality_gate.py scripts/ci_policy.py scripts/check_supply_chain.py scripts/supply_chain.py scripts/dependency_inventory.py scripts/release.py scripts/release_policy.py scripts/homebrew.py scripts/owned_kind.py scripts/verify_kind_lifecycle.py scripts/verify_quickstart.py scripts/standard_kind.py scripts/verify_port_forwards_kind.py scripts/verify_mutations_kind.py scripts/verify_editing_kind.py scripts/verify_workloads_kind.py scripts/verify_operations_kind.py scripts/verify_credential_interop_kind.py scripts/verify_transfers_kind.py scripts/verify_custom_resources_kind.py scripts/verify_aggregate_logs_kind.py scripts/merge_runtime_coverage.py
      - name: Run behavioral, gate-regression and clean-distribution checks
        run: uv run pytest --cov=kuberich --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Verify required runtime controls and merge successful replay branch coverage
        run: uv run python -m scripts.merge_runtime_coverage
      - name: Verify context sessions, resource views and watches on an owned disposable cluster
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: |
          curl --fail --location --retry 3 --max-time 60 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 --output "$RUNNER_TEMP/kuberich-kind"
          printf '%s  %s\n' 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d' "$RUNNER_TEMP/kuberich-kind" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/kuberich-kind"
          uv run python -m scripts.verify_contexts_kind --kind "$RUNNER_TEMP/kuberich-kind"
      - name: Require real-kind cleanup on setup/body cancellation and injected failure
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_kind_lifecycle --kind "$RUNNER_TEMP/kuberich-kind"
      - name: Verify actual selected-container shells on an owned disposable cluster
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: |
          mkdir -p "$RUNNER_TEMP/kuberich-shell/bin"
          curl --fail --location --retry 3 --max-time 60 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl --output "$RUNNER_TEMP/kuberich-shell/bin/kubectl"
          printf '%s  %s\n' '8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a' "$RUNNER_TEMP/kuberich-shell/bin/kubectl" | sha256sum --check
          chmod 700 "$RUNNER_TEMP/kuberich-shell/bin/kubectl"
          uv run python -m scripts.verify_shell_kind --kind "$RUNNER_TEMP/kuberich-kind" --kubectl "$RUNNER_TEMP/kuberich-shell/bin/kubectl"
      - name: Verify actual owned pod and Service port-forward lifecycles
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_port_forwards_kind --kind "$RUNNER_TEMP/kuberich-kind" --kubectl "$RUNNER_TEMP/kuberich-shell/bin/kubectl"
      - name: Verify generic credentials TLS proxies logs exec and actual forwards
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_credential_interop_kind --kind "$RUNNER_TEMP/kuberich-kind" --kubectl "$RUNNER_TEMP/kuberich-shell/bin/kubectl"
      - name: Verify guarded writes and actual RBAC on an owned disposable cluster
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_mutations_kind --kind "$RUNNER_TEMP/kuberich-kind"
      - name: Verify manifest editing and strict dry-run on an owned disposable cluster
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_editing_kind --kind "$RUNNER_TEMP/kuberich-kind"
      - name: Verify actual workload scale restart status rollback and RBAC
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_workloads_kind --kind "$RUNNER_TEMP/kuberich-kind"
      - name: Verify deletion partial batches finalizers and Job operations
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_operations_kind --kind "$RUNNER_TEMP/kuberich-kind"
      - name: Verify actual attach and safe binary tree and interrupted transfers
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_transfers_kind --kind "$RUNNER_TEMP/kuberich-kind" --kubectl "$RUNNER_TEMP/kuberich-shell/bin/kubectl"
      - name: Verify custom-resource versions Table reads watches and restricted discovery
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_custom_resources_kind --kind "$RUNNER_TEMP/kuberich-kind"
      - name: Verify actual workload membership container startup churn and aggregate log cleanup
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_aggregate_logs_kind --kind "$RUNNER_TEMP/kuberich-kind"
      - name: Enforce independent production and critical-module coverage
        run: uv run python scripts/check_coverage.py coverage.json
      - name: Enforce changed executable-line coverage against the merge base
        env:
          KUBERICH_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$KUBERICH_COVERAGE_BASE" ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            KUBERICH_COVERAGE_BASE=$(git rev-parse HEAD^)
          fi
          git rev-parse --verify "$KUBERICH_COVERAGE_BASE^{commit}"
          uv run diff-cover coverage.xml --compare-branch "$KUBERICH_COVERAGE_BASE" --fail-under 90 --ignore-staged --ignore-unstaged --total-percent-float --format json:diff-coverage.json
      - name: Build and validate artifact metadata
        run: |
          uv build
          uv run twine check dist/*
      - name: Verify audited installed runtimes and artifact-linked security evidence
        run: uv run python -m scripts.check_supply_chain --verify
      - name: Rehearse the installed first-user guide on an owned disposable cluster
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' }}
        run: uv run python -m scripts.verify_quickstart --wheel dist/*.whl --kind "$RUNNER_TEMP/kuberich-kind" --kubectl "$RUNNER_TEMP/kuberich-shell/bin/kubectl"
      - name: Retain coverage evidence and candidate artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            coverage.json
            coverage.xml
            diff-coverage.json
            dist/*
            artifacts/ui/*
            artifacts/terminal/*
            artifacts/packaging/*
            artifacts/security/*
            artifacts/releases/*
            artifacts/cluster/*
            artifacts/quickstart/*
          if-no-files-found: error
          retention-days: 7
  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [plan, application]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every application matrix job to succeed
        env:
          KUBERICH_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -m scripts.check_quality_gate
