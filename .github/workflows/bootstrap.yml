name: Package bootstrap
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.4'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --locked --group dev
      - name: Check lint, formatting and types
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy --strict src/kubetrol
      - name: Run behavioral and clean-distribution checks
        run: uv run pytest --cov=kubetrol --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=json
      - name: Build and validate artifact metadata
        run: |
          uv build
          uv run twine check dist/*
      - name: Retain coverage evidence and candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bootstrap-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            coverage.json
            coverage.xml
            dist/*
          if-no-files-found: error
          retention-days: 7
  bootstrap-gate:
    name: Bootstrap checks
    if: ${{ always() }}
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete matrix to succeed
        env:
          KUBETROL_BOOTSTRAP_RESULT: ${{ needs.bootstrap.result }}
        run: test "$KUBETROL_BOOTSTRAP_RESULT" = success
