name: Homebrew bottles
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Published version whose tap formula is bottled
        required: true
        type: string
      operation:
        description: build only, build and publish after approval, or verify the merged tap
        required: true
        type: choice
        default: build
        options: [build, publish, verify]
permissions:
  contents: read
concurrency:
  group: bottles-${{ inputs.version }}
  cancel-in-progress: false
env:
  BOTTLE_VERSION: ${{ inputs.version }}
  HOMEBREW_NO_ANALYTICS: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'
  HOMEBREW_NO_AUTOREMOVE: '1'
jobs:
  build:
    name: Build bottle (${{ matrix.tag }})
    if: ${{ inputs.operation != 'verify' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: macos-15, tag: arm64_sequoia}
          - {os: macos-15-intel, tag: sequoia}
          - {os: ubuntu-24.04, tag: x86_64_linux}
    steps:
      - name: Select the runner's Homebrew and the published tap formula
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi
          brew update --quiet
          brew --version
          brew tap kuberich/tap
          formula="$(brew --repository kuberich/tap)/Formula/kuberich.rb"
          grep -qxF "# Source version: $BOTTLE_VERSION" "$formula"
          if grep -q '^  bottle do$' "$formula"; then
            echo "The tap formula already has bottles." >&2
            exit 1
          fi
      - name: Build from source with separate dependency, download and build timings
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          mkdir bottles
          {
            echo "### ${{ matrix.tag }}"
            for step in "install --only-dependencies" "fetch --build-from-source" "install --build-bottle"; do
              start=$SECONDS
              brew $step kuberich/tap/kuberich
              echo "- \`brew $step\`: $((SECONDS - start)) s"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Create the bottle and check the tag
        working-directory: bottles
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          root="https://github.com/kuberich/homebrew-tap/releases/download/kuberich-v$BOTTLE_VERSION"
          brew bottle --json --no-rebuild --root-url="$root" kuberich/tap/kuberich
          brew uninstall --force kuberich/tap/kuberich
          mv "kuberich--$BOTTLE_VERSION.${{ matrix.tag }}.bottle.tar.gz" \
            "kuberich-$BOTTLE_VERSION.${{ matrix.tag }}.bottle.tar.gz"
          sed "s|$root|file://$PWD|" "kuberich--$BOTTLE_VERSION.${{ matrix.tag }}.bottle.json" \
            > "$RUNNER_TEMP/kuberich--$BOTTLE_VERSION.${{ matrix.tag }}.bottle.json"
          shasum -a 256 ./*.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pour the exact bottle on this host from local storage
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          tap="$(brew --repository kuberich/tap)"
          # Homebrew loads formulae for `brew bottle --merge` only from a trusted tap.
          # The trust stays on this disposable runner.
          brew trust --formula kuberich/tap/kuberich
          brew bottle --merge --write --no-commit "$RUNNER_TEMP"/kuberich--*.bottle.json
          start=$SECONDS
          brew install kuberich/tap/kuberich 2>&1 | tee "$RUNNER_TEMP/pour.log"
          echo "- bottle pour: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"
          grep -Eq "Pouring kuberich--?$BOTTLE_VERSION\\.${{ matrix.tag }}\\.bottle\\.tar\\.gz" "$RUNNER_TEMP/pour.log"
          if grep -q "Resource kuberich--" "$RUNNER_TEMP/pour.log"; then
            echo "The bottle install fetched Python resources." >&2
            exit 1
          fi
          test "$(kuberich --version)" = "kuberich $BOTTLE_VERSION"
          brew test kuberich/tap/kuberich
          brew uninstall --force kuberich/tap/kuberich
          git -C "$tap" checkout -- Formula
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle-${{ matrix.tag }}
          path: bottles/
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Store bottles and propose the formula change
    needs: build
    if: ${{ inputs.operation == 'publish' }}
    environment:
      name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.10.4'
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottle-*
          path: bottles
          merge-multiple: true
      - name: Upload checked bottles once and open the formula-only tap pull request
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: uv run --locked python -m scripts.homebrew bottles --bottles bottles
  verify:
    name: Verify the merged tap pours (${{ matrix.os }})
    if: ${{ inputs.operation == 'verify' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    steps:
      - name: Install like a user and confirm the bottle is poured
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi
          brew update --quiet
          start=$SECONDS
          brew install kuberich/tap/kuberich 2>&1 | tee install.log
          echo "- \`${{ matrix.os }}\` install with dependencies: $((SECONDS - start)) s" >> "$GITHUB_STEP_SUMMARY"
          grep -Eq "Pouring kuberich--?$BOTTLE_VERSION\\." install.log
          test "$(kuberich --version)" = "kuberich $BOTTLE_VERSION"
          # Users install without trust; `brew test` loads the formula only once trusted.
          brew trust --formula kuberich/tap/kuberich
          brew test kuberich/tap/kuberich
          brew uninstall kuberich/tap/kuberich
