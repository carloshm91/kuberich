name: Native installation qualification
'on':
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/installation.yml
      - scripts/homebrew.py
      - packaging/homebrew/**
      - tests/packaging/test_homebrew_native.py
      - tests/packaging/test_homebrew_bottle_native.py
      - tests/support/source_candidate.py
      - tests/support/homebrew_dependencies.py
permissions:
  contents: read
concurrency:
  group: installation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  homebrew:
    name: Homebrew (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Separate bounded core setup (80m), application checks (60m), and runner overhead.
    timeout-minutes: 155
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.10.4'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Select the owned runner's Homebrew
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
            /home/linuxbrew/.linuxbrew/bin/brew --version
          else
            brew --version
          fi
      - name: Prepare and time core dependencies on this owned runner
        timeout-minutes: 80
        run: uv run python -m tests.support.homebrew_dependencies
      - name: Qualify real source installation and version upgrade
        timeout-minutes: 60
        env:
          KUBERICH_QUALIFY_HOMEBREW: '1'
        run: uv run pytest -q --tb=short tests/packaging/test_homebrew_native.py
      - name: Retain original candidate bytes and installed behavior
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installation-${{ matrix.os }}
          path: |
            artifacts/installation/**
            artifacts/terminal/upgraded-homebrew-*
          if-no-files-found: error
          retention-days: 7
  bottle:
    name: Homebrew bottle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Separate bounded core setup (80m), bottle checks (90m), and runner overhead.
    timeout-minutes: 185
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.10.4'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group dev
      - name: Select the owned runner's Homebrew
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
            /home/linuxbrew/.linuxbrew/bin/brew --version
          else
            brew --version
          fi
      - name: Prepare and time core dependencies on this owned runner
        timeout-minutes: 80
        run: uv run python -m tests.support.homebrew_dependencies
      - name: Build a candidate bottle and pour it on upgrade from the published release
        timeout-minutes: 90
        env:
          KUBERICH_QUALIFY_HOMEBREW_BOTTLES: '1'
        run: uv run pytest -q --tb=short tests/packaging/test_homebrew_bottle_native.py
      - name: Retain candidate bottles, timings and poured behavior
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bottle-${{ matrix.os }}
          path: |
            artifacts/installation/**
            artifacts/terminal/bottle-homebrew-*
          if-no-files-found: error
          retention-days: 7
