name: Repository validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate plan, dependency graph, audit mappings and documentation links
        run: python3 scripts/validate_plan.py
      - name: Check whitespace
        run: git diff-tree --root --check HEAD
