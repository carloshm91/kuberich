name: Repository validation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate plan, dependency graph, audit mappings and documentation links
        run: python3 scripts/validate_plan.py
      - name: Check whitespace
        run: git diff-tree --root --check HEAD
